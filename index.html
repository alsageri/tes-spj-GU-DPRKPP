<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi & Tracking SPJ GU - DPRKPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { dprkpp: { 50: '#f0fdf4', 100: '#dcfce7', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' } } } } }
    </script>
    <style>
      #login-screen { position: fixed; inset: 0; background: #0f172a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #main-app { display: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
      <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-lock"></i></div>
        <h2 class="text-xl font-bold text-slate-800 mb-1">Akses Sistem SPJ</h2>
        <!-- Teks petunjuk sudah disesuaikan dengan PIN asli di bawah -->
        <p class="text-xs text-slate-500 mb-2">PPTK: 12345678 | Verifikator: admin</p>
        <input type="password" id="pin-input" placeholder="••••••" class="w-full text-center tracking-widest text-2xl py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none mb-4" onkeypress="if(event.key==='Enter') checkPin()">
        <button onclick="checkPin()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition-colors">Masuk</button>
        <p id="pin-error" class="text-red-500 text-xs mt-3 hidden font-medium">PIN Salah!</p>
      </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="flex flex-col min-h-screen">
      <!-- HEADER -->
      <header class="bg-dprkpp-800 text-white shadow-md sticky top-0 z-30">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div class="flex items-center space-x-3 text-center sm:text-left">
                  <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center border border-white/20"><i class="fa-solid me-0 fa-building-columns text-emerald-300 text-xl"></i></div>
                  <div>
                      <h1 class="font-bold text-lg leading-tight">Sistem SPJ GU (<span id="role-badge" class="text-emerald-300"></span>)</h1>
                      <p class="text-xs text-emerald-200">Dinas Perumahan Rakyat, Kawasan Permukiman dan Pertanahan</p>
                  </div>
              </div>
              <div class="flex items-center gap-2">
                  <button id="btnAjukanBaru" onclick="openModal('modalNewSpj')" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow flex items-center gap-2"><i class="fa-solid fa-plus"></i><span>Ajukan SPJ Baru</span></button>
                  <button onclick="fetchDataFromGoogleSheets()" class="bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-sm border border-slate-600"><i class="fa-solid fa-rotate" id="refresh-icon"></i></button>
              </div>
          </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full space-y-4">
          <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
              <div class="overflow-x-auto rounded-lg border border-slate-200">
                  <table class="w-full text-left border-collapse text-sm">
                      <thead>
                          <tr class="bg-slate-100 text-slate-700 border-b border-slate-200 font-semibold">
                              <th class="py-3 px-4">Tgl & No. NPD</th>
                              <th class="py-3 px-4">PPTK & Unit Kerja</th>
                              <th class="py-3 px-4">Uraian SPJ GU</th>
                              <th class="py-3 px-4 text-right">Nominal (Rp)</th>
                              <th class="py-3 px-4 text-center">Status</th>
                              <th class="py-3 px-4 text-center">Aksi</th>
                          </tr>
                      </thead>
                      <tbody id="spjTableBody" class="divide
