<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi SPJ GU - DPRKPP</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    #login-screen { text-align: center; padding-top: 50px; }
    #login-screen input { padding: 10px; font-size: 16px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; text-align: center; }
    button { padding: 10px 15px; background-color: #0056b3; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background-color: #004494; }
    #main-app { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #0056b3; color: white; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .status-badge { padding: 5px 10px; border-radius: 4px; color: white; font-weight: bold; font-size: 12px; }
    .bg-proses { background-color: #ffc107; color: black; }
    .bg-setuju { background-color: #28a745; }
    .bg-revisi { background-color: #dc3545; }
  </style>
</head>
<body>

  <div class="container" id="login-screen">
    <h2>Sistem Verifikasi SPJ GU - DPRKPP</h2>
    <p>Masukkan PIN untuk mengakses sistem</p>
    <input type="password" id="pin-input" placeholder="PIN Akses">
    <br>
    <button onclick="checkPin()">Masuk</button>
    <p id="pin-error" style="color:red; display:none; margin-top:10px;">PIN Salah! Silakan coba lagi.</p>
  </div>

  <div class="container" id="main-app">
    <h2>Input Pengajuan SPJ GU</h2>
    <form id="spj-form">
      <div class="form-group">
        <label>Tanggal Pengajuan</label>
        <input type="date" id="tanggal" required>
      </div>
      <div class="form-group">
        <label>Bidang / Bagian</label>
        <input type="text" id="bidang" placeholder="Contoh: Bidang Perumahan" required>
      </div>
      <div class="form-group">
        <label>Keterangan / Uraian</label>
        <input type="text" id="keterangan" placeholder="Contoh: Belanja ATK" required>
      </div>
      <div class="form-group">
        <label>Nominal (Rp)</label>
        <input type="number" id="nominal" required>
      </div>
      <button type="submit" id="btn-submit">Kirim Pengajuan</button>
    </form>

    <hr style="margin: 30px 0;">

    <h2>Daftar Verifikasi SPJ GU</h2>
    <button onclick="loadData()" style="margin-bottom: 10px; background-color: #28a745;">Muat Ulang Data</button>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Tanggal</th>
            <th>Bidang</th>
            <th>Keterangan</th>
            <th>Nominal</th>
            <th>Status</th>
            <th>Aksi Verifikasi</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7" style="text-align: center;">Mengambil data dari server...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // === PENGATURAN UTAMA ===
    const PIN_AKSES = "perkimtan"; // Ganti angka ini dengan PIN yang kamu inginkan
    const APPS_SCRIPT_URL = "Uhttps://script.google.com/macros/s/AKfycbxupEq8226jh8L5SpKfCd3XRDDSpYbqELlZ0Kd-sZu49G_MfkGvDmRm_fEZlec7ZBye2A/exec"; // Tempel URL Apps Script di sini
    // ========================

    function checkPin() {
      const pin = document.getElementById("pin-input").value;
      if (pin === PIN_AKSES) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("main-app").style.display = "block";
        loadData();
      } else {
        document.getElementById("pin-error").style.display = "block";
      }
    }

    function loadData() {
      document.getElementById("table-body").innerHTML = '<tr><td colspan="7" style="text-align: center;">Memuat data...</td></tr>';
      fetch(APPS_SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          let rows = '';
          if(data.length === 0) {
            rows = '<tr><td colspan="7" style="text-align: center;">Belum ada data pengajuan.</td></tr>';
          } else {
            data.forEach(row => {
              let statusClass = row.status === 'Disetujui' ? 'bg-setuju' : (row.status === 'Revisi' ? 'bg-revisi' : 'bg-proses');
              rows += `<tr>
                <td>${row.id}</td>
                <td>${row.tanggal}</td>
                <td>${row.bidang}</td>
                <td>${row.keterangan}<br><small style="color:red">${row.catatan ? 'Catatan: '+row.catatan : ''}</small></td>
                <td>Rp ${parseInt(row.nominal).toLocaleString('id-ID')}</td>
                <td><span class="status-badge ${statusClass}">${row.status}</span></td>
                <td>
                  <select id="status-${row.id}">
                    <option value="Proses" ${row.status === 'Proses' ? 'selected' : ''}>Proses</option>
                    <option value="Disetujui" ${row.status === 'Disetujui' ? 'selected' : ''}>Disetujui</option>
                    <option value="Revisi" ${row.status === 'Revisi' ? 'selected' : ''}>Revisi</option>
                  </select>
                  <input type="text" id="catatan-${row.id}" placeholder="Catatan (opsional)" value="${row.catatan}" style="width:100px; margin-top:5px; font-size:11px;">
                  <button onclick="updateStatus('${row.id}')" style="padding: 5px 10px; font-size: 11px; margin-top:5px;">Simpan</button>
                </td>
              </tr>`;
            });
          }
          document.getElementById("table-body").innerHTML = rows;
        })
        .catch(error => {
          document.getElementById("table-body").innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">Gagal memuat data. Periksa koneksi internet atau pengaturan URL.</td></tr>';
        });
    }

    document.getElementById('spj-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      btn.innerText = "Mengirim...";
      btn.disabled = true;

      const payload = {
        action: 'create',
        tanggal: document.getElementById("tanggal").value,
        bidang: document.getElementById("bidang").value,
        keterangan: document.getElementById("keterangan").value,
        nominal: document.getElementById("nominal").value
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      }).then(res => res.json()).then(res => {
        alert("Data pengajuan berhasil dikirim!");
        document.getElementById("spj-form").reset();
        btn.innerText = "Kirim Pengajuan";
        btn.disabled = false;
        loadData();
      }).catch(err => {
        alert("Terjadi kesalahan saat mengirim data.");
        btn.innerText = "Kirim Pengajuan";
        btn.disabled = false;
      });
    });

    function updateStatus(id) {
      const status = document.getElementById(`status-${id}`).value;
      const catatan = document.getElementById(`catatan-${id}`).value;
      
      const payload = {
        action: 'update',
        id: id,
        status: status,
        catatan: catatan
      };

      alert("Menyimpan perubahan...");
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      }).then(res => res.json()).then(res => {
        alert("Status berhasil diperbarui!");
        loadData();
      });
    }
  </script>
</body>
</html>
